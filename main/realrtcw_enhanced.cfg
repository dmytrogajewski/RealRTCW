// Rend2 defaults aligned to iortcw upstream
seta r_hdr "1"
seta r_toneMap "1"
seta r_autoExposure "1"
seta r_postProcess "1"

// SSAO off by default (upstream)
seta r_ssao "0"

// Shadows (maximum quality)
seta r_shadowMapSize "8192"
seta r_shadowFilter "1"      // PCF
seta r_shadowBlur "1"

// Materials
seta r_normalMapping "1"
seta r_specularMapping "1"
seta r_parallaxMapping "0"
seta r_parallaxMapShadows "0"
seta r_pbr "0"
seta r_cubeMapping "0"

echo "Applied rend2 defaults (iortcw baseline)."

